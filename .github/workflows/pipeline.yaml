name: Pipeline Java
on:
    push:
        branches: main
    workflow_dispatch:
    pull_request:
        branches: main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:            
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                distribution: 'temurin'
                java-version: '21'
                cache: 'maven'
            - run: mvn clean package -DskipTests
              working-directory: ./java-pipeline