name: Pipeline Java
on:
    push:
        branches: main
    workflow_dispatch:
    pull_request:
        branches: main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:            
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                distribution: 'temurin'
                java-version: '21'
                cache: 'maven'
            - run: mvn clean package -DskipTests
              working-directory: ./java-pipeline
            - uses: actions/upload-artifact@v6
              with:
                name: java-artifacts
                path: ./java-pipeline/target/*.jar
    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                distribution: 'temurin'
                java-version: 21
            - run: mvn test
              working-directory: ./java-pipeline
            - run: exit 1
    docker:
        needs: [build, test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v6
              with:
                name: java-artifacts
